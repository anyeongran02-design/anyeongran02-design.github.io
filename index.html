<style>
:root{
  --brand:#2a74c5; --brand-dark:#1b4f8a; --brand-soft:#e8f1fb;
  --accent:#e5484d; --accent-soft:#fdecee;
  --green:#2f9e55; --green-soft:#e6f5ea;
  --bg:#fbfaf7; --surface:#ffffff; --line:#ebe8e1;
  --text:#1f2421; --muted:#5b6360;
  --radius:18px; --shadow:0 8px 28px rgba(40,30,20,.08);
  --max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;scroll-behavior:smooth}
body{font-family:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img,svg{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:#fff;padding:10px 16px;z-index:999}
.skip:focus{left:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 상단 유틸 */
.util{background:var(--brand-dark);color:#dfeee7;font-size:.82rem}
.util .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.util a:hover{color:#fff}
.util .links{display:flex;gap:16px}
.fontctl{display:flex;align-items:center;gap:6px}
.fontctl button{width:24px;height:24px;border:1px solid rgba(255,255,255,.35);border-radius:6px;font-size:.8rem}

/* 헤더 */
header.site{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;flex-shrink:0}
.logo small{display:block;font-size:.7rem;font-weight:500;color:var(--muted);letter-spacing:0}
.gnb{display:flex;gap:4px}
.gnb>li{list-style:none;position:relative}
.gnb>li>a{display:block;padding:26px 18px;font-weight:700;font-size:1.02rem}
.gnb>li>a:hover,.gnb>li.on>a{color:var(--brand)}
.gnb .sub{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;min-width:170px;display:none}
.gnb>li:hover .sub,.gnb>li:focus-within .sub{display:block}
.gnb .sub a{display:block;padding:8px 12px;border-radius:8px;font-size:.92rem;white-space:nowrap}
.gnb .sub a:hover{background:var(--brand-soft);color:var(--brand)}
.report-btn{background:var(--accent);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;font-size:.92rem;white-space:nowrap}
.report-btn:hover{filter:brightness(.95)}
.menu-btn{display:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line)}
.menu-btn span{display:block;width:20px;height:2px;background:var(--text);margin:4px auto}

/* 모바일 메뉴 */
.mnav{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.mnav.open{display:block}
.mnav .panel{position:absolute;right:0;top:0;bottom:0;width:min(86vw,340px);background:var(--surface);overflow-y:auto;padding:20px}
.mnav .close{float:right;font-size:1.6rem;line-height:1}
.mnav h3{margin:22px 0 6px;color:var(--brand);font-size:1rem}
.mnav a{display:block;padding:8px 4px;border-bottom:1px solid var(--line)}

/* 히어로 */
.hero{background:linear-gradient(135deg,#1f7a5c 0%,#2f9471 55%,#5fb08d 100%);color:#fff;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding-top:64px;padding-bottom:84px}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.25;letter-spacing:-.03em;font-weight:800}
.hero h1 em{font-style:normal;color:#ffe2b8}
.hero p{margin-top:16px;font-size:1.06rem;opacity:.92;max-width:520px}
.hero .cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 20px;border-radius:999px;font-weight:700}
.btn.w{background:#fff;color:var(--brand-dark)}
.btn.o{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.btn.g{background:var(--brand);color:#fff}
.hero-art{justify-self:center;width:100%;max-width:400px}
.hero-wave{position:absolute;bottom:-1px;left:0;width:100%;height:50px}

/* 퀵메뉴 */
.quick{margin-top:-46px;position:relative;z-index:2}
.quick ul{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:10px;list-style:none}
.quick a{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 6px;border-radius:14px;text-align:center;font-weight:600;font-size:.93rem}
.quick a:hover{background:var(--brand-soft)}
.quick .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.quick li:nth-child(1) .ic{background:var(--accent-soft);color:var(--accent)}

section.blk{padding-top:64px}
.blk-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;gap:12px}
.blk-head h2{font-size:1.6rem;letter-spacing:-.03em}
.blk-head p{color:var(--muted);font-size:.95rem}
.more{color:var(--brand);font-weight:700;font-size:.92rem;white-space:nowrap}

/* 소식 + 위기가구 */
.news-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px}
.news-grid>*,.biz>*,.gal>*,.grid2>*,.grid3>*{min-width:0}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:24px}
.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
.nlist{list-style:none}
.nlist li a{display:flex;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.nlist li:last-child a{border:0}
.nlist .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlist a:hover .t{color:var(--brand);text-decoration:underline}
.nlist .d{color:var(--muted);font-size:.88rem;flex-shrink:0}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-right:6px;vertical-align:1px}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.sos{background:linear-gradient(160deg,#fff6ec,#fde6cd);border:1px solid #f6d3ad}
.sos h3{font-size:1.25rem;letter-spacing:-.02em}
.sos p{color:#6d4a2b;font-size:.93rem;margin:8px 0 16px}
.sos .tel{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.sos .tel b{font-size:1.4rem;color:var(--accent);letter-spacing:-.02em}
.sos .tel span{font-size:.85rem;color:var(--muted)}

/* 주요사업 */
.biz{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.biz a{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .15s,box-shadow .15s}
.biz a:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.biz .thumb{height:130px;display:grid;place-items:center}
.biz .body{padding:18px}
.biz h3{font-size:1.06rem;margin-bottom:6px}
.biz p{color:var(--muted);font-size:.9rem}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--brand-dark);color:#fff;border-radius:20px;padding:30px 10px}
.stats div{text-align:center;padding:6px;border-right:1px solid rgba(255,255,255,.15)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:2.1rem;letter-spacing:-.03em}
.stats span{font-size:.9rem;opacity:.8}

/* 갤러리 */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.gal a{display:block}
.gal .ph{aspect-ratio:4/3;border-radius:var(--radius);display:grid;place-items:center;overflow:hidden}
.gal h4{margin-top:10px;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal span{color:var(--muted);font-size:.85rem}

/* 협력기관 */
.partners{display:flex;flex-wrap:wrap;gap:10px}
.partners a{flex:1 1 180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-weight:600;font-size:.92rem;color:var(--muted)}
.partners a:hover{color:var(--brand);border-color:var(--brand)}

/* 서브페이지 */
.sub-hero{background:linear-gradient(135deg,#1f7a5c,#3a9a77);color:#fff;padding:46px 0 40px}
.sub-hero h1{font-size:clamp(1.6rem,3.6vw,2.2rem);letter-spacing:-.03em}
.crumb{font-size:.85rem;opacity:.85;margin-bottom:6px}
.sub-wrap{display:grid;grid-template-columns:230px 1fr;gap:36px;padding-top:36px;padding-bottom:20px}
.lnb{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;align-self:start;position:sticky;top:96px}
.lnb h2{background:var(--brand);color:#fff;font-size:1.05rem;padding:18px 20px}
.lnb a{display:block;padding:12px 20px;border-top:1px solid var(--line);font-weight:600;font-size:.95rem}
.lnb a.on,.lnb a:hover{color:var(--brand);background:var(--brand-soft)}
.content{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:36px;min-width:0}
.content h2{font-size:1.45rem;letter-spacing:-.03em;padding-bottom:14px;margin-bottom:24px;border-bottom:2px solid var(--text)}
.content h3{font-size:1.15rem;margin:30px 0 12px;padding-left:12px;border-left:4px solid var(--brand)}
.content h3:first-of-type{margin-top:0}
.content p{margin-bottom:12px}
.content ul.dot{list-style:none;margin-bottom:12px}
.content ul.dot li{position:relative;padding-left:14px;margin-bottom:6px}
.content ul.dot li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.note{background:var(--brand-soft);border-radius:12px;padding:16px 18px;color:var(--brand-dark);font-size:.93rem;margin:16px 0}
.greet{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:start}
.portrait{aspect-ratio:3/4;border-radius:var(--radius);background:linear-gradient(160deg,var(--brand-soft),#cfe6da);display:grid;place-items:center;color:var(--brand);font-size:.85rem;text-align:center}
.greet .lead{font-size:1.3rem;font-weight:700;color:var(--brand-dark);line-height:1.45;margin-bottom:18px;letter-spacing:-.02em}
.sign{text-align:right;margin-top:24px;font-weight:700}
.sign span{display:block;font-weight:500;color:var(--muted);font-size:.9rem}

.tbl-wrap{overflow-x:auto;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.93rem;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:center}
thead th{background:#f1f4f0;border-top:2px solid var(--text);font-weight:700}
td.l{text-align:left}
tbody tr:hover{background:#fafbf9}

.timeline{list-style:none;border-left:2px solid var(--brand-soft);margin-left:8px}
.timeline li{position:relative;padding:0 0 22px 24px}
.timeline li::before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.timeline b{color:var(--brand);display:block}

.org{display:flex;flex-direction:column;align-items:center;gap:0}
.org .box{background:var(--brand);color:#fff;border-radius:12px;padding:14px 22px;font-weight:700;text-align:center;min-width:240px}
.org .box small{display:block;font-weight:500;opacity:.85;font-size:.82rem}
.org .box.lt{background:var(--brand-soft);color:var(--brand-dark)}
.org .box.ac{background:var(--accent)}
.org .vline{width:2px;height:26px;background:#b9d5c7}
.org .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px}
.org .row .box{min-width:0;flex:1 1 130px;padding:12px 10px;font-size:.92rem}
.org-side{display:flex;align-items:center;gap:10px}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:20px}
.tile h4{font-size:1.04rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tile p{color:var(--muted);font-size:.92rem;margin:0}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:.85rem;flex-shrink:0}

.board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.board-top .cnt{color:var(--muted);font-size:.9rem}
.board-top .cnt b{color:var(--brand)}
.search{display:flex;gap:6px}
.search input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;min-width:0;width:200px}
.search button{background:var(--text);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600}
.view-head{border-top:2px solid var(--text);border-bottom:1px solid var(--line);padding:18px 4px}
.view-head h3{border:0;padding:0;margin:0 0 6px;font-size:1.25rem}
.view-head .meta{color:var(--muted);font-size:.88rem;display:flex;gap:16px;flex-wrap:wrap}
.view-body{padding:28px 4px;border-bottom:1px solid var(--line);min-height:160px;white-space:pre-line}
.attach{padding:14px 4px;border-bottom:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.view-foot{display:flex;justify-content:center;margin-top:24px}

.form .row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line)}
.form .row:first-of-type{border-top:2px solid var(--text)}
.form label{background:#f1f4f0;padding:14px;font-weight:700;font-size:.92rem}
.form .f{padding:10px 14px}
.form input[type=text],.form input[type=tel],.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
.form textarea{min-height:120px;resize:vertical}
.agree{margin:18px 0;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:.9rem;color:var(--muted)}
.agree label{display:flex;gap:8px;align-items:center;color:var(--text);font-weight:600;margin-top:10px}

.map{aspect-ratio:16/8;border-radius:var(--radius);background:repeating-linear-gradient(45deg,#eef3ee 0 12px,#e5ece6 12px 24px);display:grid;place-items:center;color:var(--muted);margin-bottom:20px;text-align:center;padding:20px}

.logo img{height:42px;width:auto}
.vision-card{border-radius:var(--radius);background:linear-gradient(160deg,var(--brand-soft),#cfe6da);padding:22px 16px;text-align:center}
.vision-card img{margin:0 auto 14px;max-width:100%;height:auto;mix-blend-mode:multiply}
.vision-card p{font-weight:700;color:var(--brand-dark);line-height:1.5}
.vision{background:linear-gradient(135deg,var(--brand),#3a9a77);color:#fff;border-radius:var(--radius);padding:22px 24px;margin:18px 0 8px;text-align:center}
.vision small{display:block;opacity:.85;margin-bottom:4px}
.vision b{font-size:1.25rem;letter-spacing:-.02em}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.towns{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.town{border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.town b{display:block;color:var(--brand-dark);font-size:1.05rem}
.town span{font-size:.78rem;color:var(--muted)}
.min-tabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.min-tabs a{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.min-tabs a[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chips a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.88rem;color:var(--muted);background:var(--surface)}
.chips a.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.min-tbl small{color:var(--muted)}
@media (max-width:640px){
  .min-tbl{min-width:0}
  .min-tbl thead{display:none}
  .min-tbl tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .min-tbl td{border:0!important;padding:0!important;text-align:left}
  .min-tbl td:first-child{display:none}
  .min-tbl td.l{grid-column:1/-1}
  .min-tbl td:nth-child(3){color:var(--muted);font-size:.9rem}
}
.opinion-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding:20px 22px;border-radius:var(--radius);background:var(--green-soft)}
.opinion-cta p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
/* 첫 화면 배너 (밀리며 넘어감) */
.bn{position:relative;overflow:hidden;background:#e9eef2}
.bn-track{display:flex;transition:transform .7s cubic-bezier(.65,0,.35,1)}
@media (prefers-reduced-motion:reduce){.bn-track{transition:none}}

function noticeList(q=""){
  const rows = NOTICES.filter(n => !q || n.title.includes(q));
  return `
    <div class="board-top">
      <span class="cnt">전체 <b>${rows.length}</b>건</span>
      <form class="search" id="nSearch" role="search"><input type="search" placeholder="제목 검색" value="${esc(q)}" aria-label="검색어"><button>검색</button></form>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th style="width:70px">번호</th><th style="width:80px">분류</th><th>제목</th><th style="width:110px">등록일</th></tr></thead><tbody>
      ${rows.map(n=>`<tr><td>${n.id}</td><td><span class="badge">${n.cat}</span></td><td class="l"><a href="#/news/notice/${n.id}">${esc(n.title)}</a>${isNew(n.date)?' <span class="badge new">NEW</span>':""}</td><td>${n.date}</td></tr>`).join("") || `<tr><td colspan="4">검색 결과가 없습니다.</td></tr>`}

function noticeView(id){
  const n = NOTICES.find(x => x.id == id);
  if (!n) return `<p>게시글을 찾을 수 없습니다.</p>`;
  return `
    <div class="view-head"><h3>${esc(n.title)}</h3><div class="meta"><span>분류 ${n.cat}</span><span>작성자 사무국</span><span>등록일 ${n.date}</span></div></div>
    <div class="view-body">${esc(n.body)}</div>
    <div class="view-foot"><a class="btn g" href="#/news/notice">목록</a></div>`;
}

/* 네이버 지도: SITE.naverMapKey가 있으면 페이지 안에 지도를 띄웁니다 */
function initMap(){
  const el = $("#nmap");
  if (!el || !SITE.naverMapKey) return;
  const draw = () => naver.maps.Service.geocode({ query: SITE.roadAddr }, (status, res) => {
    const a = status === naver.maps.Service.Status.OK && res.v2.addresses[0];
    if (!a) return;
    const pos = new naver.maps.LatLng(+a.y, +a.x);
    el.innerHTML = ""; el.classList.add("live");
    const map = new naver.maps.Map(el, { center: pos, zoom: 17 });
    const mk = new naver.maps.Marker({ position: pos, map });
    new naver.maps.InfoWindow({ content: `<div style="padding:8px 12px;font-size:13px"><b>${SITE.name}</b><br>${SITE.place} 3층</div>` }).open(map, mk);
  });
  if (window.naver && naver.maps && naver.maps.Service) return draw();
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(SITE.naverMapKey)}&submodules=geocoder`;
  s.onload = draw; document.head.appendChild(s);
}

/* ---------------- 라우터 ---------------- */
function render(){
  clearInterval(slTimer);
  const [, k, s, id] = (location.hash.replace(/^#/, "") || "/").split("/").map(decodeURIComponent);
  const main = $("#main");
  document.querySelectorAll(".gnb>li").forEach(li => li.classList.toggle("on", li.dataset.k === k));
  if (!k){ main.innerHTML = home(); bindHome(); }
  else {
    const grp = MENU.find(m => m.k === k) || (k === "info" ? {k:"info", t:"이용안내", items:[["privacy","개인정보처리방침"],["email","이메일무단수집거부"],["map","찾아오시는 길"]]} : null);
    const page = grp && P[k] && P[k][s];
    if (!page){ main.innerHTML = `<div class="wrap" style="padding:80px 20px;text-align:center"><h1>페이지를 찾을 수 없습니다</h1><p style="margin:12px 0 24px;color:var(--muted)">주소를 다시 확인해 주세요.</p><a class="btn g" href="#/">홈으로</a></div>`; return; }
    const title = grp.items.find(i => i[0] === s)[1];
    main.innerHTML = `
      <div class="sub-hero"><div class="wrap"><p class="crumb">홈 › ${grp.t} › ${title}</p><h1>${title}</h1></div></div>
      <div class="wrap sub-wrap">
        <nav class="lnb" aria-label="${grp.t} 하위 메뉴"><h2>${grp.t}</h2>${grp.items.map(i=>`<a href="#/${k}/${i[0]}" class="${i[0]===s?"on":""}" ${i[0]===s?'aria-current="page"':""}>${i[1]}</a>`).join("")}</nav>
        <article class="content"><h2>${title}</h2>${page(id, sessionQ)}</article>
      </div>`;
    bindSub();
  }
  window.scrollTo({top:0, behavior:"instant"});
}
let sessionQ = "";
let slTimer = null;
function bindSlider(){
  const root = $("#slider"); if (!root) return;
  const slides = [...root.querySelectorAll(".slide")], dots = [...root.querySelectorAll(".sl-dots button")], pb = $("#slPause");
  let i = 0, paused = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const go = n => { i = (n + slides.length) % slides.length;
    slides.forEach((s,k)=>{ s.classList.toggle("on", k===i); s.setAttribute("aria-hidden", k!==i); });
    dots.forEach((d,k)=>d.classList.toggle("on", k===i)); };
  const start = () => { clearInterval(slTimer); if (!paused) slTimer = setInterval(()=>go(i+1), 4500); };
  dots.forEach(d => d.onclick = () => { go(+d.dataset.i); start(); });
  pb.onclick = () => { paused = !paused; pb.textContent = paused ? "▶" : "❚❚"; pb.setAttribute("aria-label", paused ? "자동 넘김 시작" : "자동 넘김 멈추기"); start(); };
  if (paused) { pb.textContent = "▶"; pb.setAttribute("aria-label","자동 넘김 시작"); }
  root.onmouseenter = () => clearInterval(slTimer); root.onmouseleave = start;
  start();
}
/* 첫 화면 배너: 옆으로 밀리며 넘어갑니다 */
function bindBanner(){
  const track = $("#bnTrack"); if (!track) return;
  const n = track.children.length, dots = [...document.querySelectorAll("#bnDots button")], pb = $("#bnPause");
  let i = 0, paused = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const go = k => { i = (k + n) % n; track.style.transform = `translateX(-${i*100}%)`;
    [...track.children].forEach((s,j) => { s.setAttribute("aria-hidden", j!==i); s.tabIndex = j===i ? 0 : -1; });
    dots.forEach((d,j) => d.classList.toggle("on", j===i)); };
  const start = () => { clearInterval(slTimer); if (!paused) slTimer = setInterval(() => go(i+1), 5000); };
  $("#bnPrev").onclick = () => { go(i-1); start(); };
  $("#bnNext").onclick = () => { go(i+1); start(); };
  dots.forEach(d => d.onclick = () => { go(+d.dataset.i); start(); });
  const setPb = () => { pb.textContent = paused ? "▶" : "❚❚"; pb.setAttribute("aria-label", paused ? "자동 넘김 시작" : "자동 넘김 멈추기"); };
  pb.onclick = () => { paused = !paused; setPb(); start(); }; setPb();
  const root = $("#bn"); root.onmouseenter = () => clearInterval(slTimer); root.onmouseleave = start;
  let x0 = null;
  root.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  root.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { go(dx < 0 ? i+1 : i-1); start(); } x0 = null; });
  go(0); start();
}
/* 첫 화면 달력 */
let calYM = null;
function renderCal(){
  const el = $("#cal"); if (!el) return;
  if (!calYM) { const t = new Date(); calYM = [t.getFullYear(), t.getMonth()]; }
  const [y, m] = calYM, first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  const key = d => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const ev = d => SCHEDULE.filter(s => s.date === key(d));
  const t = new Date(), isToday = d => t.getFullYear()===y && t.getMonth()===m && t.getDate()===d;
  let cells = Array(first).fill(`<span></span>`);
  for (let d = 1; d <= days; d++) { const e = ev(d), w = (first + d - 1) % 7;
    cells.push(`<button type="button" class="d${w===0?" sun":w===6?" sat":""}${isToday(d)?" today":""}${e.length?" has":""}" data-d="${d}" ${e.length?"":"tabindex=\"-1\""} aria-label="${m+1}월 ${d}일${e.length?` 일정 ${e.length}건`:""}"><span>${d}</span>${e.length?`<i>일정${e.length}건</i>`:""}</button>`); }
  const monthEv = SCHEDULE.filter(s => s.date.startsWith(`${y}-${String(m+1).padStart(2,"0")}`)).sort((a,b)=>a.date.localeCompare(b.date));
  const item = s => `<li><b>${+s.date.slice(8)}일${s.time?` ${s.time}`:""}</b> ${s.title}${s.place?`<small>${s.place}</small>`:""}</li>`;
  el.innerHTML = `
    <div class="cal-head"><button type="button" id="calPrev" aria-label="이전 달">‹</button><h2>${y}년 ${m+1}월</h2><button type="button" id="calNext" aria-label="다음 달">›</button></div>
    <div class="cal-grid">${["일","월","화","수","목","금","토"].map((w,i)=>`<em class="${i===0?"sun":i===6?"sat":""}">${w}</em>`).join("")}${cells.join("")}</div>
    <ul class="cal-list" id="calList">${monthEv.map(item).join("") || `<li class="none">등록된 일정이 없습니다.</li>`}</ul>`;
  $("#calPrev").onclick = () => { calYM = m === 0 ? [y-1, 11] : [y, m-1]; renderCal(); };
  $("#calNext").onclick = () => { calYM = m === 11 ? [y+1, 0] : [y, m+1]; renderCal(); };
  el.querySelectorAll(".d.has").forEach(b => b.onclick = () => {
    el.querySelectorAll(".d.sel").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
    $("#calList").innerHTML = ev(+b.dataset.d).map(item).join(""); });
}
function bindHome(){
  bindSlider();
  bindBanner();
  renderCal();
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
    const cat = b.dataset.cat;
    $("#homeList").innerHTML = NOTICES.filter(x => !cat || x.cat === cat).slice(0,5).map(x => `<li><a href="#/news/notice/${x.id}"><span class="t"><span class="badge ${isNew(x.date)?"new":""}">${isNew(x.date)?"NEW":x.cat}</span>${esc(x.title)}</span><span class="d">${x.date.slice(5).replace("-",".")}</span></a></li>`).join("") || `<li style="padding:12px 2px;color:var(--muted)">등록된 글이 없습니다.</li>`;
  });
}
function bindSub(){
  const f = $("#nSearch");
  if (f) f.onsubmit = e => { e.preventDefault(); sessionQ = f.querySelector("input").value.trim(); render(); sessionQ = ""; };
  const r = $("#reportForm");
  if (r) r.onsubmit = e => {
    e.preventDefault();
    alert("온라인 접수는 준비 중입니다.\n\n가까운 읍·면 행정복지센터 또는 보건복지상담센터 129(24시간)로 전화해 주시면 바로 확인해 드립니다.");
  };
  const o = $("#opinionForm");
  if (o) o.onsubmit = e => {
    e.preventDefault();
    const v = id => $("#" + id).value.trim();
    if ((v("of4") || v("of5")) && !$("#of6").checked) { alert("이름이나 연락처를 적으셨다면 개인정보 수집·이용에 동의해 주세요."); return; }
    const body = `[사는 곳] ${v("of1")}\n[분야] ${v("of2")}\n[의견]\n${v("of3")}\n\n[이름] ${v("of4") || "밝히지 않음"}\n[연락처] ${v("of5") || "없음"}`;
    if (!confirm("메일 앱이 열리면 '보내기'를 눌러 주세요.\n메일 앱을 쓰기 어려우시면 " + SITE.tel + "로 전화 주셔도 됩니다.")) return;
    location.href = `mailto:${SITE.email}?subject=${encodeURIComponent("[주민 의견] " + v("of2"))}&body=${encodeURIComponent(body)}`;
  };
  initMap();
}
