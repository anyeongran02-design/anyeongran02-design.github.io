<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="성금이 모이는 행복금고 저금통">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9ec"/><stop offset="1" stop-color="#ffc4cc"/></linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffe3e7" stop-opacity=".9"/></linearGradient>
    <symbol id="h" viewBox="0 0 20 19"><path d="M10 18S0 12 0 5.5A5 5 0 0 1 10 3a5 5 0 0 1 10 2.5C20 12 10 18 10 18z"/></symbol>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="40" cy="36" r="46" fill="#fff" opacity=".35"/>
  <circle cx="292" cy="170" r="58" fill="#fff" opacity=".3"/>
  <ellipse cx="160" cy="182" rx="78" ry="9" fill="#d9636f" opacity=".18"/>
  <!-- 동전이 떨어지는 모습 -->
  <g fill="#ffcf3f" stroke="#e3a300" stroke-width="2.5">
    <ellipse cx="160" cy="26" rx="12" ry="12"/>
  </g>
  <path d="M160 20v12M156 26h8" stroke="#e3a300" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 저금통 병 -->
  <rect x="104" y="66" width="112" height="112" rx="26" fill="url(#jar)" stroke="#e8505b" stroke-width="4"/>
  <rect x="116" y="50" width="88" height="20" rx="8" fill="#e8505b"/>
  <rect x="146" y="56" width="28" height="6" rx="3" fill="#a52a35"/>
  <!-- 안의 동전 -->
  <g stroke="#e3a300" stroke-width="2">
    <ellipse cx="132" cy="160" rx="16" ry="7" fill="#ffd34d"/>
    <ellipse cx="160" cy="163" rx="16" ry="7" fill="#ffcf3f"/>
    <ellipse cx="188" cy="160" rx="16" ry="7" fill="#ffd34d"/>
    <ellipse cx="146" cy="150" rx="16" ry="7" fill="#ffdb66"/>
    <ellipse cx="174" cy="150" rx="16" ry="7" fill="#ffd34d"/>
    <ellipse cx="160" cy="140" rx="16" ry="7" fill="#ffe17a"/>
  </g>
  <!-- 이름표 -->
  <rect x="128" y="88" width="64" height="34" rx="10" fill="#e8505b"/>
  <use href="#h" x="150" y="95" width="20" height="19" fill="#fff"/>
  <!-- 병 빛 -->
  <path d="M116 84v60" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <!-- 떠오르는 하트 -->
  <use href="#h" x="232" y="58" width="30" height="28" fill="#ff6b7d"/>
  <use href="#h" x="258" y="96" width="18" height="17" fill="#ff8f9c"/>
  <use href="#h" x="58" y="78" width="26" height="24" fill="#ff6b7d"/>
  <use href="#h" x="40" y="118" width="16" height="15" fill="#ffa3ad"/>
  <g fill="#fff"><circle cx="226" cy="40" r="3"/><circle cx="86" cy="54" r="2.5"/><circle cx="270" cy="140" r="2.5"/><circle cx="66" cy="150" r="3"/></g>
</svg>
